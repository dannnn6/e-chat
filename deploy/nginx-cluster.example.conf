# Place upstream at http{} level, not inside server{}.
# Example assumes WireGuard/private addresses; replace before use.
upstream echat_api {
    server 127.0.0.1:3080 max_fails=2 fail_timeout=10s;
    server 10.66.0.2:3080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
